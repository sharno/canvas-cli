[workspace]
members = ["canvas-cli", "canvas-core", "canvas-models"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
canvas-core = { path = "canvas-core" }
canvas-models = { path = "canvas-models" }
clap = { version = "4.5.54", features = ["derive"] }
csv = "1.3.0"
dirs = "6.0.0"
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
toml = "0.9.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
